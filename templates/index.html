<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encurtador de URL</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 80px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    .erro { color: #b00020; margin-top: 12px; }
    .resultado { margin-top: 16px; padding: 12px; background: #eef6ff; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Encurtador de URL</h1>
  <form method="post">
    <input type="text" name="url" placeholder="Cole sua URL aqui" required>
    <button type="submit">Encurtar</button>
  </form>
  {% if error %}<p class="erro">{{ error }}</p>{% endif %}
  {% if short_url %}
    <div class="resultado">
      Seu link: <a href="{{ short_url }}" target="_blank">{{ short_url }}</a>
    </div>
  {% endif %}
</body>
</html>
